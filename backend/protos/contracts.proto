syntax = "proto3";

package mlfactory;

// =====================
//      Health Check
// =====================
service HealthService {
  rpc CheckApp (HealthRequest) returns (HealthResponse);
  rpc CheckS3 (S3HealthRequest) returns (HealthResponse);
}

message HealthRequest {}

message S3HealthRequest {
  string bucket = 1;
}

message HealthResponse {
  string app = 1;
  string s3 = 2;
  string bucket = 3;
}

// =====================
//     User Storage
// =====================
service UserStorageService {
  rpc ListDatasets (UserRequest) returns (DatasetsResponse);
  rpc ListModels (UserModelRequest) returns (ModelsResponse);
  rpc ListScores (UserModelRequest) returns (ScoresResponse);
}

message UserRequest {
  string user_id = 1;
}

message UserModelRequest {
  string user_id = 1;
  string data_id = 2;
}

message DatasetInfo {
  string data_id = 1;
  string name = 2;
}

message ModelScore {
  string name = 1;
  double value = 2;
}

message FitResult {
  string name = 1;
  repeated ModelScore scores = 2;
}

message DatasetsResponse {
  string user_id = 1;
  repeated DatasetInfo datasets = 2;
}

message ModelsResponse {
  string user_id = 1;
  string data_id = 2;
  repeated string models = 3;
}

message ScoresResponse {
  string user_id = 1;
  string data_id = 2;
  repeated FitResult scores = 3;
}

// =====================
//    Dataset Registry
// =====================
service DatasetRegistryService {
  rpc GetUsage (UserRequest) returns (UsageResponse);
  rpc UploadFile (UploadRequest) returns (UploadResponse);
  rpc DeleteFile (FileRequest) returns (DeleteResponse);
  rpc LoadSample (FileRequest) returns (LoadResponse);
}

message FileRequest {
  string user_id = 1;
  string data_id = 2;
}

message UploadRequest {
  string user_id = 1;
  string filename = 2;
  bytes file_bytes = 3;
}

message UploadResponse {
  string user_id = 1;
  string data_id = 2;
  string filename = 3;
}

message UsageResponse {
  string user_id = 1;
  double usage_mb = 2;
}

message DeleteResponse {
  string user_id = 1;
  string data_id = 2;
  string status = 3;
}

message LoadResponse {
  string user_id = 1;
  string data_id = 2;
  repeated string columns = 3;
  int32 rows = 4;
  string sample_json = 5;
}

// =====================
//      Model Service
// =====================
service ModelService {
  rpc Train (TrainRequest) returns (TrainResponse);
  rpc Predict (PredictRequest) returns (PredictResponse);
  rpc Delete (DeleteRequest) returns (ModelDeleteResponse);
}

message TrainRequest {
  string user_id = 1;
  string data_id = 2;
  string run_config_json = 3;
}

message TrainResponse {
  string user_id = 1;
  string data_id = 2;
  string model_name = 3;
  string s3_key = 4;
  string metrics_json = 5;
}

message PredictRequest {
  string user_id = 1;
  string data_id = 2;
  string model_name = 3;
  string input_data_json = 4;
}

message PredictResponse {
  repeated double predictions = 1;
}

message DeleteRequest {
  string user_id = 1;
  string data_id = 2;
  string model_name = 3;
}

message ModelDeleteResponse {
  string user_id = 1;
  string data_id = 2;
  string model_name = 3;
  string status = 4;
}