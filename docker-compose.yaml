version: "3.8"

services:
  minio:
    image: minio/minio
    container_name: minio
    restart: always
    ports:
      - "${S3_PORT}:9000"
      - "${S3_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_REGION: ${S3_REGION}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data: